<style>
/* Layout: full-bleed infinite canvas, floating tool dock (left), inspector (top centre), theme + menu (top right), zoom (bottom right) */
:root{--bg:#ffffff;--ink:#0d3d22;--ink2:#4a6a57;--grid:rgba(13,61,34,.17);--surface:#ffffff;--surface2:#eaf3ed;--line:#d3e2d8;--accent:#0d3d22;--accent-ink:#ffffff;--sel:#2e7d32;--shadow:0 8px 28px rgba(13,61,34,.16),0 1px 3px rgba(13,61,34,.14);--wm:.075;--ui:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Playfair Display",Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="sepia"]){--bg:#08150e;--ink:#e8f3ec;--ink2:#9db8a8;--grid:rgba(232,243,236,.14);--surface:#0f2218;--surface2:#183423;--line:#27452f;--accent:#00c853;--accent-ink:#04200f;--sel:#00c853;--shadow:0 8px 28px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);--wm:.09;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08150e;--ink:#e8f3ec;--ink2:#9db8a8;--grid:rgba(232,243,236,.14);--surface:#0f2218;--surface2:#183423;--line:#27452f;--accent:#00c853;--accent-ink:#04200f;--sel:#00c853;--shadow:0 8px 28px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);--wm:.09;color-scheme:dark}
:root[data-theme="sepia"]{--bg:#f3e6c8;--ink:#3b2c14;--ink2:#7a6540;--grid:rgba(95,70,25,.22);--surface:#fbf2db;--surface2:#ecdcb4;--line:#d9c697;--accent:#0d3d22;--accent-ink:#fbf2db;--sel:#2e7d32;--shadow:0 8px 28px rgba(80,55,15,.22),0 1px 3px rgba(80,55,15,.2);--wm:.11}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--ui);-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#stage{position:fixed;inset:0}
#wm{position:absolute;left:50%;top:50%;width:min(62vmin,640px);aspect-ratio:1;transform:translate(-50%,-50%);background:var(--ink);opacity:var(--wm);pointer-events:none;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#ed{position:absolute;display:block;margin:0;padding:0;border:0;outline:0;resize:none;background:transparent;overflow:hidden;font-family:var(--ui);-webkit-user-select:text;user-select:text;z-index:5}
button{font:inherit;color:inherit;cursor:pointer}
.float{position:fixed;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:10}
.ib{width:38px;height:38px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;padding:0;flex:none;position:relative}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{background:var(--surface2)}
.ib.on{background:var(--accent);color:var(--accent-ink)}
.ib:focus-visible,.tb:focus-visible,.seg button:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.ib.fl::after{content:"";position:absolute;right:4px;bottom:4px;border:3px solid transparent;border-right-color:currentColor;border-bottom-color:currentColor;opacity:.55}
#dock{left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(50% + 4px);transform:translateY(-50%);padding:6px;display:flex;flex-direction:column;gap:2px;max-height:calc(100% - 150px);overflow-y:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
#dock .sep{height:1px;background:var(--line);margin:4px 6px;flex:none}
#grip{height:14px;cursor:grab;color:var(--ink2);display:grid;place-items:center;flex:none;touch-action:none}
#grip i{width:22px;height:4px;border-radius:2px;background:var(--line)}
#brand{left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 12px);padding:7px 14px;display:flex;align-items:baseline;gap:8px}
#brand b{font:700 17px var(--serif);letter-spacing:.2px}
#brand span{color:var(--ink2);font-size:12px}
#topr{right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 12px);padding:5px;display:flex;gap:4px;align-items:center}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500}
.seg button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
#insp{left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;max-width:min(760px,calc(100% - 520px));justify-content:center}
#insp .g{display:flex;align-items:center;gap:6px}
#insp .l{font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.sw{display:flex;gap:4px;flex-wrap:wrap;max-width:230px}
.sw button{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);padding:0}
.sw button.on{outline:2px solid var(--sel);outline-offset:1px}
.sw .none{background:linear-gradient(135deg,transparent 45%,#c62828 45%,#c62828 55%,transparent 55%),var(--surface)}
.sw .auto{background:linear-gradient(135deg,var(--ink) 50%,var(--bg) 50%)}
.sw input[type=color]{width:22px;height:22px;padding:0;border:0;background:none;cursor:pointer}
#insp input[type=range]{width:90px;accent-color:var(--sel)}
.tb{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px;font-size:12.5px;font-weight:500}
.tb:hover{background:var(--surface2)}.tb.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#insp select{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font:inherit;font-size:12.5px}
#fly{padding:8px;display:grid;grid-template-columns:repeat(4,44px);gap:4px;z-index:20}
#fly.wide{grid-template-columns:repeat(3,1fr);width:210px}
#fly button{height:44px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;padding:0;font-size:24px}
#fly.wide button{height:40px;font-size:12.5px;grid-column:span 3;display:flex;align-items:center;gap:10px;padding:0 8px;justify-content:flex-start}
#fly button:hover{background:var(--surface2)}#fly button.on{background:var(--accent);color:var(--accent-ink)}
#fly canvas{width:36px;height:36px}
#fly svg{width:42px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
#zoom{right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:4px;display:flex;align-items:center;gap:2px}
#zoom .pct{min-width:52px;text-align:center;font-weight:600;font-size:12.5px;border:0;background:none;border-radius:8px;height:32px}
#zoom .pct:hover{background:var(--surface2)}
#zoom .ib{width:34px;height:34px}
#hist{left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:4px;display:flex}
#hist .ib{width:34px;height:34px}.ib:disabled{opacity:.35;cursor:default}
#mini{right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 64px);width:168px;height:112px;overflow:hidden;cursor:pointer;touch-action:none}
#mini canvas{width:100%;height:100%;display:block}
#menu{padding:6px;min-width:210px;display:flex;flex-direction:column;gap:2px;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 62px);z-index:20}
#menu button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:9px;display:flex;gap:10px;align-items:center;font-size:13.5px}
#menu button:hover{background:var(--surface2)}
#menu svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:30;display:grid;place-items:center;padding:16px}
#modal .box{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:min(720px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px}
#modal h2{margin:0 0 4px;font:700 22px var(--serif)}#modal p{margin:0 0 16px;color:var(--ink2)}
#tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
#tpl button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
#tpl button:hover{border-color:var(--sel);background:var(--surface2)}#tpl b{font-size:14.5px}#tpl span{color:var(--ink2);font-size:12.5px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:10px;font-size:13px;z-index:40;pointer-events:none;box-shadow:var(--shadow)}
@media (max-width:1100px){#insp{max-width:calc(100% - 24px);top:calc(env(safe-area-inset-top,0px) + 64px)}}
@media (max-width:720px){
#brand{display:none}#topr .seg button span{display:none}
#dock{top:auto;left:8px;right:8px;max-height:none;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);transform:none;flex-direction:row;max-height:none;overflow-x:auto;overflow-y:hidden;padding:5px}
#dock .sep{width:1px;height:24px;margin:7px 4px}#grip{display:none}
#hist,#zoom{bottom:calc(env(safe-area-inset-bottom,0px) + 68px)}#hist{left:8px}#zoom{right:8px}#mini{display:none}
#insp{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 112px)}
#toast{bottom:calc(env(safe-area-inset-bottom,0px) + 120px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

 if(e.button===1||t==='hand'||spaceDown){mode='pan';drag={};cv.style.cursor='grabbing';return}
 if(t==='select'){const so=sel();
  if(so.length===1){const o=so[0],hh=handlesFor(o).find(h=>Math.hypot(h.x-s.x,h.y-s.y)<=(h.k?14:9));
   if(hh&&(!o.locked||hh.k==='add')){if(hh.k==='add'){addMindChild(o,hh.id.slice(4));commit();return}
    if(hh.k==='orbit'){mode='orbit';drag={o,rx:o.rx,ry:o.ry,sx:s.x,sy:s.y};return}
    if(hh.k==='pt'){mode='linept';drag={o,which:hh.id};return}
    mode='resize';drag={o,id:hh.id,ob:{...bb(o)}};return}}
  const o=topHit(w);
  if(o){if(e.shiftKey){select(S.sel.includes(o.id)?S.sel.filter(i=>i!==o.id):[...S.sel,o.id])}else if(!S.sel.includes(o.id))select([o.id]);startMove(o,w)}

 if(t==='shape'||t==='solid'||t==='frame'){let o;
  if(t==='shape')o={type:'shape',kind:S.sub.shape,x:w.x,y:w.y,w:1,h:1,text:'',...DEF.shape};
  else if(t==='solid')o={type:'3d',kind:S.sub.solid,x:w.x,y:w.y,w:1,h:1,rx:.5,ry:.65,rz:0,fill:DEF.solid.fill,op:DEF.solid.op,spin:false,wire:false};
  else o={type:'frame',x:w.x,y:w.y,w:1,h:1,title:'Frame '+(S.objs.filter(q=>q.type==='frame').length+1),...DEF.frame};
  add(o);mode='create';drag={o,x0:w.x,y0:w.y};return}
 if(t==='line'){const L=LINES[S.sub.line]||LINES[1],tg=findTarget(w,null);const o=add({type:'line',kind:L.k,head:L.head,x1:w.x,y1:w.y,x2:w.x,y2:w.y,a:tg?tg.id:null,b:null,...DEF.line,dash:!!L.dash});mode='line';drag={o};return}
 let o=null;
 if(t==='text'){o=mkText(w.x,w.y-14,'',DEF.text.size);startAfter(o)}

cv.addEventListener('pointermove',e=>{const s=sp(e);hover=s;if(P.has(e.pointerId))P.set(e.pointerId,s);
 if(mode==='pinch'&&P.size>=2){const [a,b]=[...P.values()],d=Math.hypot(a.x-b.x,a.y-b.y)||1,mx=(a.x+b.x)/2,my=(a.y+b.y)/2,z=clamp(drag.v.z*d/drag.d,.03,10),wx=(drag.mx-drag.v.x)/drag.v.z,wy=(drag.my-drag.v.y)/drag.v.z;V.z=z;V.x=mx-wx*z;V.y=my-wy*z;inv();return}
 if(!mode){if(S.tool==='eraser'||S.tool==='laser')inv();return}

 switch(mode){
 case 'pan':V.x+=s.x-lastS.x;V.y+=s.y-lastS.y;break;
 case 'move':{const dx=w.x-drag.last.x,dy=w.y-drag.last.y;if(!drag.moved&&Math.hypot(w.x-drag.w0.x,w.y-drag.w0.y)*V.z<3)break;drag.moved=true;for(const o of drag.items)moveObj(o,dx,dy,drag.ids);drag.last=w;break}
 case 'marquee':{const r={x:Math.min(drag.x0,w.x),y:Math.min(drag.y0,w.y),w:Math.abs(w.x-drag.x0),h:Math.abs(w.y-drag.y0)};marquee=r;const ids=S.objs.filter(o=>{const b=bb(o);return o.type==='frame'?(b.x>=r.x&&b.y>=r.y&&b.x+b.w<=r.x+r.w&&b.y+b.h<=r.y+r.h):inter(b,r)}).map(o=>o.id);S.sel=[...new Set([...drag.base,...ids])];break}
 case 'draw':{const p=drag.o.pts[drag.o.pts.length-1];if(Math.hypot(w.x-p[0],w.y-p[1])>=1.5/V.z){drag.o.pts.push([w.x,w.y]);drag.o._b=null}break}
 case 'erase':eraseAt(w);break;
 case 'laser':laser.push({x:s.x,y:s.y,t:performance.now()});break;
 case 'create':{const o=drag.o;o.x=Math.min(drag.x0,w.x);o.y=Math.min(drag.y0,w.y);o.w=Math.abs(w.x-drag.x0);o.h=Math.abs(w.y-drag.y0);break}
 case 'line':{drag.o.x2=w.x;drag.o.y2=w.y;live={target:findTarget(w,drag.o)};break}
 case 'linept':{const o=drag.o,k=drag.which==='p1'?'1':'2';o['x'+k]=w.x;o['y'+k]=w.y;o[drag.which==='p1'?'a':'b']=null;live={target:findTarget(w,o)};break}
 case 'resize':{const o=drag.o,ob=drag.ob,id=drag.id;let x1=ob.x,y1=ob.y,x2=ob.x+ob.w,y2=ob.y+ob.h;
  if(id.includes('w'))x1=w.x;if(id.includes('e'))x2=w.x;if(id.includes('n'))y1=w.y;if(id.includes('s'))y2=w.y;
  if(x2-x1<24){if(id.includes('w'))x1=x2-24;else x2=x1+24}if(y2-y1<24){if(id.includes('n'))y1=y2-24;else y2=y1+24}
  if((o.type==='image'||o.type==='3d')&&id.length===2){const nw=x2-x1,nh=nw*ob.h/ob.w;if(id.includes('n'))y1=y2-nh;else y2=y1+nh}
  o.x=x1;o.y=y1;o.w=x2-x1;o.h=o.type==='text'?o.h:y2-y1;if(o.type==='text')fitText(o);break}
 case 'orbit':drag.o.ry=drag.ry+(s.x-drag.sx)*.012;drag.o.rx=drag.rx+(s.y-drag.sy)*.012;break}
 lastS=s;inv()});

 if(!mode)return;const m=mode,d=drag;mode=null;drag=null;cv.style.cursor=curFor();
 switch(m){
 case 'draw':commit();break;
 case 'erase':if(d.changed)commit();break;
 case 'move':if(d.moved)commit();else if(d.o.type==='timer'){const o=d.o,lx=d.w0.x-o.x,ly=d.w0.y-o.y;if(ly>48){const i=Math.floor(lx/50);if(i===0&&!o.run)o.left=Math.max(0,o.left-60);else if(i===1){if(o.run){o.left=timerLeft(o);o.run=false}else if(o.left>0){o.run=true;o.end=Date.now()+o.left*1000}}else if(i===2&&!o.run)o.left+=60;else if(i===3){o.run=false;o.left=300}commit()}}break;
